# Template de Configuração Nginx Segura para Ubuntu 24.04 LTS
# Local recomendado no servidor: /etc/nginx/sites-available/stripe-webhook

limit_req_zone $binary_remote_addr zone=stripe_limit:10m rate=15r/s;

server {
    listen 80;
    server_name seu-dominio.com; # Substitua pelo seu domínio ou subdomínio

    # Redirecionamento forçado para HTTPS (gerenciado pelo Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com; # Substitua pelo seu domínio ou subdomínio

    # Certificados SSL Let's Encrypt (gerados automaticamente via certbot)
    ssl_certificate /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeçalhos de Blindagem de Segurança HTTP (A+ no SSL Labs)
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Limite rigoroso de tamanho do payload
    client_max_body_size 2M;

    # Rota do Webhook da Stripe
    location /webhook {
        # Limite de taxa de requisições por IP
        limit_req zone=stripe_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Rota de Health Check
    location /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    # Bloqueia qualquer outro endpoint desconhecido
    location / {
        return 404;
    }
}
